name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: "3.1.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # setup-android@v3 is broken: it runs `sdkmanager tools` and Google removed
      # the legacy 'tools' package from the SDK repository ("Failed to find package 'tools'").
      # The ubuntu-24.04 runner already ships the SDK; we only accept licenses
      # and install the exact components this project needs.
      - name: Android SDK (licenses + components)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: UI checks (bridge coverage + JS syntax)
        run: |
          python3 tests/check-bridge.py
          for f in app/src/main/assets/ui/js/*.js; do node --check "$f"; done
          node --check tests/mock.js

      - name: Runtime (proot + Linux rootfs + opencode 1.x)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-runtime.sh

      - name: UI assets (libraries and file icons)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-ui-deps.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-opencodemob}"
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks; fi
          if [ ! -f keystore/release.jks ]; then
            echo "::warning::No keystore in repo or secrets - generated a throwaway one. OTA updates will not install over older builds."
            keytool -genkeypair -alias opencodemob -keyalg RSA -keysize 2048 -validity 36500 \
              -keystore keystore/release.jks -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=OpenCode Mobile, O=OpenCodeMob, C=RU"
          fi
          echo "Register this SHA-1 in the Google Cloud Android OAuth client:"
          keytool -list -v -keystore keystore/release.jks -storepass "$PASS" | grep -E "SHA1:"

      - name: Build APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # OCM Hybrid is its own package (app.ocmhybrid) with its own version line; it never has
          # to out-rank the original OpenCode's versionCodes.
          CODE=$((31000000 + GITHUB_RUN_NUMBER))
          gradle :app:assembleRelease --no-daemon -PappVersionName="$VERSION_NAME" -PappVersionCode="$CODE"
          cp app/build/outputs/apk/release/app-release.apk "OCMHybrid-${VERSION_NAME}-${CODE}.apk"
          {
            echo "OCM Hybrid ${VERSION_NAME}"
            echo
            echo "Core: opencode $(grep opencode_core runtime-info.txt | cut -d= -f2) (1.x line) + Linux rootfs proot"
            echo
            echo "3.1.0 — отдельное приложение OCM Hybrid:"
            echo "- Свой пакет app.ocmhybrid: ставится рядом с OpenCode, не обновляет его и не пересекается с ним"
            echo "- Обновления сохраняют всё: чаты, ключи, настройки и установленные движки"
            echo "- Движки перенесены в HOME: обновление ядра больше не стирает Hermes / TITAN / TITAN CLI"
            echo "- При обновлении ядра переносятся /usr/local, пакеты apt и их база"
            echo 
            echo "- Настройки → Интерфейс: переключение между OpenCode, Hermes Agent, TITAN и TITAN CLI"
            echo "- Hermes Agent (Nous Research): самообучающийся агент со своей веб-панелью"
            echo "- TITAN: Mission Control, команда агентов и общая память"
            echo "- TITAN CLI: сжатие токенов (filter / compress / benchmark) в терминале"
            echo "- Движки ставятся в общее Linux-окружение кнопкой «Установить движки»"
            echo "- Панели движков открываются в изолированном окне без доступа к данным приложения"
            echo
            echo "Telegram: https://t.me/OpenCodeMob"
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OCM Hybrid ${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          body_path: notes.md
          files: OCMHybrid-*.apk
          make_latest: true
